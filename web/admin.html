<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SR EARNING HUB — Admin</title><style>body{margin:0;background:#070a10;color:#eef2ff;font-family:Arial}.wrap{max-width:700px;margin:auto;padding:18px}.card{background:#111827;border:1px solid #253044;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.input,button{padding:12px;border-radius:10px;border:1px solid #344054;background:#0b1220;color:white}button{cursor:pointer;background:#2563eb;border:0}.ok{background:#15803d}.bad{background:#be123c}.muted{color:#98a5bb}.item{padding:12px 0;border-top:1px solid #273244}.key{width:100%;box-sizing:border-box}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b1220;padding:12px;border-radius:12px}</style></head><body><div class="wrap"><h1>👑 SR EARNING HUB</h1><div class="muted">Admin Panel</div><div class="card"><input id="key" class="input key" type="password" placeholder="ADMIN_KEY"><button onclick="login()">Login</button></div><div id="panel" style="display:none"><div class="card"><div class="stats"><div class="stat">Users<br><b id="users">0</b></div><div class="stat">Pending Tasks<br><b id="pt">0</b></div><div class="stat">Pending WD<br><b id="pw">0</b></div></div></div><div class="card"><h3>⚙️ Settings</h3><input id="code" class="input" placeholder="Task code"><input id="reward" class="input" type="number" placeholder="Reward"><input id="min" class="input" type="number" placeholder="Minimum withdrawal"><button onclick="saveSettings()">Save Settings</button></div><div class="card"><h3>📥 Tasks</h3><div id="tasks">Loading...</div></div><div class="card"><h3>💸 Withdrawals</h3><div id="wds">Loading...</div></div></div></div><script>let key='';async function api(url,opt={}){opt.headers={...(opt.headers||{}),'X-Admin-Key':key,'Content-Type':'application/json'};let r=await fetch(url,opt);let x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}async function login(){key=document.getElementById('key').value.trim();try{await refresh();document.getElementById('panel').style.display='block'}catch(e){alert(e.message)}}async function refresh(){let x=await api('/api/admin/overview');users.textContent=x.users;pt.textContent=x.pending_tasks;pw.textContent=x.pending_withdrawals;code.value=x.task_code;reward.value=x.reward;min.value=x.min_withdraw;let t=await api('/api/admin/tasks');tasks.innerHTML=t.items.map(i=>`<div class=item><b>#${i.id}</b> ${i.status}<br>User: ${i.user_id}<br>${esc(i.identifier)}<br>${i.status==='pending'?`<button class=ok onclick="actTask(${i.id},'approve')">Approve</button> <button class=bad onclick="actTask(${i.id},'reject')">Reject</button>`:''}</div>`).join('')||'None';let w=await api('/api/admin/withdrawals');wds.innerHTML=w.items.map(i=>`<div class=item><b>#${i.id}</b> ${i.status}<br>User: ${i.user_id} • ৳${Number(i.amount).toFixed(2)} • ${esc(i.method)}<br><code>${esc(i.account)}</code><br>${i.status==='pending'?`<button class=ok onclick="actWd(${i.id},'paid')">Mark Paid</button> <button class=bad onclick="actWd(${i.id},'reject')">Reject</button>`:''}</div>`).join('')||'None'}async function saveSettings(){try{await api('/api/admin/settings',{method:'POST',body:JSON.stringify({task_code:code.value,reward:Number(reward.value),min_withdraw:Number(min.value)})});alert('Saved');refresh()}catch(e){alert(e.message)}}async function actTask(id,a){try{await api('/api/admin/task/'+id+'/'+a,{method:'POST'});refresh()}catch(e){alert(e.message)}}async function actWd(id,a){try{await api('/api/admin/withdrawal/'+id+'/'+a,{method:'POST'});refresh()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
