<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SR EARNING HUB</title><style>body{margin:0;background:#080b12;color:#eef2ff;font-family:Arial,sans-serif}.wrap{max-width:430px;margin:auto;padding:20px}.logo{font-size:27px;font-weight:900}.sub{color:#8e9ab2}.card{background:#111827;border:1px solid #202a3a;border-radius:20px;padding:18px;margin-top:16px}.bal{font-size:32px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:15px;font-weight:800;color:white;background:#1d4ed8}.btn.red{background:#be123c}.btn.green{background:#15803d}.btn.gold{background:#a16207}.input{width:100%;box-sizing:border-box;background:#0b1220;color:white;border:1px solid #293449;border-radius:12px;padding:13px;margin:8px 0}.small{font-size:13px;color:#9aa7bd}.status{color:#4ade80;font-weight:800}</style></head><body><div class="wrap"><div class="logo">SR EARNING HUB</div><div class="sub">Premium Task Platform</div><div class="card"><div class="small">AVAILABLE BALANCE</div><div class="bal">৳0.00</div><div class="status">● SYSTEM ONLINE</div></div><div class="card"><b>Today's Task Code</b><div id="code" style="font-size:22px;margin-top:8px">Loading...</div></div><div class="card"><div class="grid"><button class="btn red" onclick="alert('Open Telegram bot and submit your task there.')">📥 Tasks</button><button class="btn green" onclick="alert('Withdrawals are handled through the Telegram bot.')">💸 Withdraw</button><button class="btn" onclick="location.href='https://t.me/'">🆘 Support</button><button class="btn gold" onclick="alert('Your task history is available in the Telegram bot.')">📊 My Tasks</button></div></div><div class="card small">⚠️ Never submit Gmail passwords, OTPs, recovery codes or login credentials.</div></div><script>fetch('/api/config').then(r=>r.json()).then(x=>document.getElementById('code').textContent=x.task_code).catch(()=>document.getElementById('code').textContent='Unavailable');</script></body></html>
